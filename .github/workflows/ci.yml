name: CI

# 各ステップの実処理は scripts/ci/ の実行可能シェルスクリプトに分割されている
# （ローカルでも同じスクリプトで再現可能）。ワークフローは手順の宣言に徹する

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKENは読み取り専用で十分（最小権限の原則）
permissions:
  contents: read

# 同一ブランチへの連続pushでは古い実行をキャンセルし、フルマトリクスの二重実行を防ぐ（mainは履歴保全のためキャンセルしない）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUILD_TYPE: Debug
  LLVM_VERSION: "17"

jobs:
  # ========================================
  # Lint - コードフォーマットチェック（独立・並列）
  # ========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # ローカル開発環境（LLVM 17系）と整形結果を揃えるためバージョンを固定する
      - name: Install clang-format
        run: scripts/ci/install_clang_format.sh ${{ env.LLVM_VERSION }}

      # make format-check と同じ対象（src/tests の全C++ファイル）を検査
      - name: Check C++ format
        run: scripts/ci/check_cpp_format.sh ${{ env.LLVM_VERSION }}

  # ========================================
  # Extension Lint - VSCode拡張機能チェック（独立・並列）
  # ========================================
  extension-lint:
    name: Extension Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript compile
        run: npm run compile

      - name: ESLint check
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      # 文法JSONがsrc/grammar/のソースから生成された最新状態であることを検証
      - name: Grammar sync check
        run: npm run verify:grammar

      - name: Unit tests
        run: npm test

  # ========================================
  # Build - 全テスト共通（OS別1回のみ）
  # ========================================
  build:
    name: Build (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Cache LLVM
        uses: actions/cache@v4
        id: cache-llvm
        with:
          path: |
            /usr/lib/llvm-${{ env.LLVM_VERSION }}
            /opt/homebrew/opt/llvm@${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.os }}

      - name: Install LLVM
        run: scripts/ci/install_llvm.sh ${{ env.LLVM_VERSION }}

      - name: Install Google Test (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgtest-dev

      - name: Install Google Test (macOS)
        if: runner.os == 'macOS'
        run: brew install googletest

      # C++の再コンパイルをOS別キャッシュで短縮する（cmakeはCMAKE_*_COMPILER_LAUNCHER環境変数をconfigure時に取り込む）
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cm-ci-${{ matrix.os }}

      - name: Build compiler
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/ci/build_compiler.sh ${{ env.BUILD_TYPE }} ${{ matrix.arch }} --testing

      - name: Build runtime libraries
        run: make libs

      - name: Verify build
        run: scripts/ci/verify_build.sh

      # make format-check の .cm 整形検証と同じゲート（ビルド済みのcmを使用）
      - name: Check Cm format (tests/common, libs)
        run: find tests/common libs -type f -name '*.cm' -print0 | xargs -0 ./cm fmt --check -q

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cm-build-${{ matrix.os }}
          path: |
            build/bin/
            build/lib/
            cm
          retention-days: 1

  # ========================================
  # Unit Tests（ビルド共有、matrix並列）
  # ========================================
  unit-test:
    name: 単体テスト ${{ matrix.test_bin }} (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        # コンパイラ単体機能のテスト（tests/unit/。単一ビルドオブジェクト単位）
        test_bin: [lexer_test, error_test, mir_pass_test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cm-build-${{ matrix.os }}

      - run: chmod +x build/bin/* cm 2>/dev/null || true

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-${{ env.LLVM_VERSION }}
            /opt/homebrew/opt/llvm@${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.os }}

      - name: Install LLVM
        run: scripts/ci/install_llvm.sh ${{ env.LLVM_VERSION }} --minimal

      - name: Run ${{ matrix.test_bin }}
        run: ./build/bin/${{ matrix.test_bin }} --gtest_output=xml:test-results.xml

  # ========================================
  # C++ Regression Tests（プロセス内でコンパイルパイプラインの段階を通すgtest。
  # Cmプログラムは tests/regression/cases/ から読み込む）
  # ========================================
  cpp-regression-test:
    name: C++回帰テスト ${{ matrix.test_bin }} (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        # tests/regression/ のgtest（ケースファイルはcheckoutから読む）
        test_bin:
          - hir_lowering_test
          - mir_lowering_test
          - mir_optimization_test
          - sv_codegen_test
          - formatter_test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cm-build-${{ matrix.os }}

      - run: chmod +x build/bin/* cm 2>/dev/null || true

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-${{ env.LLVM_VERSION }}
            /opt/homebrew/opt/llvm@${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.os }}

      - name: Install LLVM
        run: scripts/ci/install_llvm.sh ${{ env.LLVM_VERSION }} --minimal

      - name: Run ${{ matrix.test_bin }}
        run: ./build/bin/${{ matrix.test_bin }} --gtest_output=xml:test-results.xml

  # ========================================
  # Integration Tests（リリースビルドのcmバイナリに対する機能テスト。
  # ビルド共有、バックエンド × O0/O3 × 2OS）
  # ========================================
  integration-test:
    name: 統合テスト ${{ matrix.config.name }} (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        config:
          - { id: jit-o0,  name: "JIT実行 O0",            target: tjitp0, backend: jit,       needs_node: false }
          - { id: jit-o3,  name: "JIT実行 O3",            target: tjitp3, backend: jit,       needs_node: false }
          - { id: llvm-o0, name: "LLVMネイティブ実行 O0",  target: tlp0,   backend: llvm,      needs_node: false }
          - { id: llvm-o3, name: "LLVMネイティブ実行 O3",  target: tlp3,   backend: llvm,      needs_node: false }
          - { id: wasm-o0, name: "WASMコンパイル+実行 O0", target: twp0,  backend: llvm-wasm, needs_node: false }
          - { id: wasm-o3, name: "WASMコンパイル+実行 O3", target: twp3,  backend: llvm-wasm, needs_node: false }
          - { id: js-o0,   name: "JSコード生成+実行 O0",  target: tjp0,   backend: js,        needs_node: true  }
          - { id: js-o3,   name: "JSコード生成+実行 O3",  target: tjp3,   backend: js,        needs_node: true  }
          - { id: sv-o0,   name: "SV生成テスト O0",       target: tsvp0,  backend: sv,        needs_node: false }
          - { id: sv-o3,   name: "SV生成テスト O3",       target: tsvp3,  backend: sv,        needs_node: false }
          # make test（ローカル既定）に含まれるinterpreterスイートをCIでも検証する
          - { id: interp-o3, name: "インタプリタ実行 O3",  target: tip3,   backend: interpreter, needs_node: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cm-build-${{ matrix.os }}

      - run: chmod +x cm 2>/dev/null || true

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-${{ env.LLVM_VERSION }}
            /opt/homebrew/opt/llvm@${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.os }}

      - name: Install LLVM
        run: scripts/ci/install_llvm.sh ${{ env.LLVM_VERSION }}

      - name: Setup Node.js
        if: matrix.config.needs_node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # インストールと検証を一体化（失敗の静かな素通りを防ぐ。
      # 2026-07-15にmacosでwasmtime欠落により391テストが無検証スキップに
      # なった事故の再発防止。ランナー側もnodeフォールバック+欠落時FAIL化済み）
      - name: Install wasmtime
        if: matrix.config.backend == 'llvm-wasm'
        run: scripts/ci/install_wasmtime.sh

      - name: Install SV tools (for SV backend tests)
        if: matrix.config.backend == 'sv'
        id: sv_tools
        run: scripts/ci/install_sv_tools.sh

      - name: Run ${{ matrix.config.name }} Tests
        id: run_tests
        env:
          CM_TEST_MAX_JOBS: "2"
        run: scripts/ci/run_backend_tests.sh ${{ matrix.config.target }}

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.config.id }}-${{ matrix.os }}
          path: test_output.log
          retention-days: 7

  # ========================================
  # Baremetal / UEFI コンパイルテスト（Linuxのみ）
  # ========================================
  baremetal-test:
    name: Baremetal / UEFI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cm-build-ubuntu-latest

      - run: chmod +x cm 2>/dev/null || true

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: /usr/lib/llvm-${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-ubuntu-latest

      - name: Install LLVM
        run: scripts/ci/install_llvm.sh ${{ env.LLVM_VERSION }}

      - name: Run Baremetal compile tests
        run: make test-baremetal

      - name: Run UEFI compile tests
        run: make test-uefi

      # リリースtarballに同梱されるexamplesが現行コンパイラで検査を通ることを保証する
      - name: Check examples compile
        run: scripts/ci/check_examples.sh

  # ========================================
  # Tooling Tests - make test に含まれるがバックエンドスイート外のE2E
  # （cm test コマンド / i18nメッセージ / linter機能テスト / サニタイザ）
  # サニタイザはOS依存が強い（ASan/TSanランタイム・MSanのLinux限定）ため両OSで検証する
  # ========================================
  tooling-test:
    name: Tooling (cm test / i18n / lint / sanitize) (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cm-build-${{ matrix.os }}

      - run: chmod +x cm 2>/dev/null || true

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-${{ env.LLVM_VERSION }}
            /opt/homebrew/opt/llvm@${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.os }}

      - name: Install LLVM
        run: scripts/ci/install_llvm.sh ${{ env.LLVM_VERSION }}

      # サニタイザE2Eのwasmレグを有効にする（未導入だとSKIPになるため明示的にインストールする）
      - name: Install wasmtime
        run: scripts/ci/install_wasmtime.sh

      - name: Run cm test command E2E
        run: make test-cm-test

      - name: Run i18n message E2E
        run: make test-i18n

      - name: Run linter functional tests
        run: make test-lint

      - name: Run sanitizer E2E
        run: make test-sanitize

  # ========================================
  # Benchmark - パフォーマンスベンチマーク
  # ========================================
  benchmark:
    name: Benchmark
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cm-build-ubuntu-latest

      - run: chmod +x cm 2>/dev/null || true

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: /usr/lib/llvm-${{ env.LLVM_VERSION }}
          key: llvm-${{ env.LLVM_VERSION }}-ubuntu-latest

      - name: Install LLVM
        run: scripts/ci/install_llvm.sh ${{ env.LLVM_VERSION }}

      - name: Run Benchmarks
        run: scripts/ci/run_benchmarks.sh
