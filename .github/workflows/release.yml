name: Release Build

# 各ステップの実処理は scripts/ci/ の実行可能シェルスクリプトに分割されている
# （ローカルでも同じスクリプトで再現可能）。ワークフローは手順の宣言に徹する

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン (例: 0.14.0)'
        required: true
        type: string
      arch:
        description: 'ターゲットアーキテクチャ'
        required: true
        type: choice
        options:
          - arm64
          - x86_64
        default: 'arm64'

permissions:
  contents: read

env:
  LLVM_VERSION: "17"

jobs:
  # ========================================
  # バージョン検証
  # ========================================
  verify:
    name: バージョン検証
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: バージョン整合チェック
        run: scripts/ci/check_release_version.sh "${{ inputs.version }}"

  # ========================================
  # リリースビルド
  # ========================================
  build:
    name: リリースビルド (${{ inputs.arch }})
    needs: verify
    runs-on: ${{ inputs.arch == 'arm64' && 'macos-14' || 'ubuntu-22.04' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: scripts/ci/install_llvm.sh ${{ env.LLVM_VERSION }}

      # Releaseモードでコンパイラビルド
      - name: コンパイラビルド (Release)
        run: scripts/ci/build_compiler.sh Release ${{ inputs.arch }}

      # stdランタイムライブラリビルド
      - name: ランタイムライブラリビルド
        run: make libs ARCH=${{ inputs.arch }}

      - name: ビルド検証
        run: scripts/ci/verify_build.sh --strict

      # VSCode拡張パッケージング
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: VSCode拡張パッケージング
        run: scripts/ci/package_vscode_extension.sh

      # 配布物構築
      - name: 配布物構築
        run: scripts/ci/build_dist.sh "${{ inputs.version }}" "${{ inputs.arch }}"

      # アーティファクトアップロード
      - name: アーティファクトアップロード
        uses: actions/upload-artifact@v4
        with:
          name: cm-v${{ inputs.version }}-${{ runner.os }}-${{ inputs.arch }}
          path: |
            dist/cm-v${{ inputs.version }}-*.tar.gz
          retention-days: 90
