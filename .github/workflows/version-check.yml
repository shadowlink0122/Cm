name: Version Check

# 各ステップの実処理は scripts/ci/ の実行可能シェルスクリプトに分割されている
# （ローカルでも同じスクリプトで再現可能）。ワークフローは手順の宣言に徹する

on:
  push:
    branches:
      - 'feature/v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: VERSION一致チェック
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: VERSIONファイルとブランチ名の整合チェック
        run: scripts/ci/check_version_branch.sh

      - name: リリースノートの存在チェック
        run: scripts/ci/check_release_note.sh

      - name: チュートリアルのバージョン表記チェック
        run: scripts/ci/check_tutorial_version.sh

      - name: VSCode拡張 package.json バージョンチェック
        run: scripts/ci/check_vscode_version.sh
