# 依存の自動更新設定（GitHub Actionsのアクションと VSCode拡張のnpm依存を週次で監視）
# CIの多重実行を避けるため、更新はエコシステムごとに1つのPRへグループ化する（Dependabotの仕様上、エコシステム間の統合は不可のため最大2PR/週）
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    # 全アクションの更新（major含む）を1つのPRにまとめる
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
    labels:
      - dependencies
    # 全npm依存の更新を1つのPRにまとめる
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # 型定義のメジャーは実行環境のNodeメジャー（CI/enginesのNode 20）に揃えて手動で上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
