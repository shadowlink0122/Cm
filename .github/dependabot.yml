# 依存の自動更新設定（GitHub Actionsのアクションと VSCode拡張のnpm依存を週次で監視）
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
    labels:
      - dependencies
    # devDependenciesのみのためminor/patchはまとめて1PRに集約する
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
